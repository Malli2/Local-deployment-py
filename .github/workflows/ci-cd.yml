
name: MTS Local Kubernetes CI-CD

on:
  push:
    branches: [devlop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mts-local-k8s-deployment
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: [self-hosted, linux, x64]

    env:
      IMAGE: ghcr.io/malli2/local-deployment-py:${{ github.sha }}
      IMAGE_LATEST: ghcr.io/malli2/local-deployment-py:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify environment
        run: |
          set -e
          docker version
          kubectl version --client
          python3 --version
          echo "Docker context: $(docker context show)"
          echo "Kubernetes context: $(kubectl config current-context)"
          kubectl get nodes

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          set -e
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .

      - name: Push Docker image to GHCR
        run: |
          set -e
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Docker Desktop Kubernetes
        run: |
          set -e
          kubectl apply -f k8s/
          kubectl set image deployment/mts-demo app="$IMAGE"
          kubectl rollout status deployment/mts-demo --timeout=180s
          kubectl get deployment,pods,service -l app=mts-demo

      - name: Expose application
        run: |
          chmod +x scripts/*.sh
          ./scripts/start-port-forward.sh

      - name: Verify application
        run: |
          set -e
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:30080/
          curl --fail http://127.0.0.1:30080/health
          curl --fail http://127.0.0.1:30080/api/v1/status
          echo "Application: http://localhost:30080"
