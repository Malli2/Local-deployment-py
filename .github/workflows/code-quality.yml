
name: Code Quality - Super Linter

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

  push:
    branches:
      - develop
      - main
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: super-linter/super-linter@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Validate the entire repository
          VALIDATE_ALL_CODEBASE: true

          # Infrastructure and security
          VALIDATE_CHECKOV: true
          VALIDATE_GITLEAKS: true

          # Repository standards
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITHUB_ACTIONS: true

          # Python quality
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_PYTHON_RUFF: true

          # YAML quality
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: true

  pyink:
    name: Pyink
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pyink
        run: python -m pip install pyink

      - name: Validate Python formatting with Pyink
        run: pyink --check .
