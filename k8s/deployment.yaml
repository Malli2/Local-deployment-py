
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mts-demo
  labels:
    app: mts-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mts-demo
  template:
    metadata:
      labels:
        app: mts-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: ghcr.io/malli2/local-deployment-py:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "MTS Deployment Platform"
            - name: APP_ENV
              value: "kubernetes"
            - name: APP_VERSION
              value: "latest"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
